# yaml-language-server: $schema=../schema/terminal.animation.v1.schema.json
version: terminal.animation/v1
animations:
  working:
    full:
      dimensions:
        width: 1
        height: 1
      playback: loop
      easing: linear
      fps: 12
      frames:
        - { content: "⠋", style: warning }
        - { content: "⠙", style: warning }
        - { content: "⠹", style: warning }
        - { content: "⠸", style: warning }
        - { content: "⠼", style: warning }
        - { content: "⠴", style: warning }
        - { content: "⠦", style: warning }
        - { content: "⠧", style: warning }
        - { content: "⠇", style: warning }
        - { content: "⠏", style: warning }
    reduced_motion:
      dimensions:
        width: 1
        height: 1
      playback: once
      easing: linear
      frames:
        - { content: "●", style: warning, duration_ms: 1000 }
  idle:
    full:
      dimensions:
        width: 1
        height: 1
      playback: loop
      easing: linear
      frames:
        - { content: "◐", style: muted, duration_ms: 650 }
        - { content: "◓", style: muted, duration_ms: 650 }
        - { content: "◑", style: muted, duration_ms: 650 }
        - { content: "◒", style: muted, duration_ms: 650 }
    reduced_motion:
      dimensions:
        width: 1
        height: 1
      playback: once
      easing: linear
      frames:
        - { content: "◌", style: muted, duration_ms: 1000 }
