name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
          - runner: macos-15
            system: aarch64-darwin
    name: Check ${{ matrix.system }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - run: nix develop --accept-flake-config --command cargo fmt --check
      - run: nix develop --accept-flake-config --command cargo clippy --all-targets -- -D warnings
      - run: nix develop --accept-flake-config --command ./hack/generate.sh --check
      - run: nix flake check --accept-flake-config --print-build-logs
      - run: nix flake check --accept-flake-config --print-build-logs ./extras
