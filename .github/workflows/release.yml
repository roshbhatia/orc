name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        runner: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - run: |
          nix build --accept-flake-config --print-build-logs .#core --out-link result-core
          nix build --accept-flake-config --print-build-logs .#extras --out-link result-extras
      - run: |
          mkdir -p dist
          tar -czf "dist/orc-${{ runner.os }}-${{ runner.arch }}.tar.gz" -C result-core .
          tar -czf "dist/orc-providers-${{ runner.os }}-${{ runner.arch }}.tar.gz" -C result-extras .
      - uses: actions/upload-artifact@v7
        with:
          name: orc-${{ runner.os }}-${{ runner.arch }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
