name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  verify-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Match the tag to Cargo.toml
        run: |
          package_version=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "orc") | .version')
          test "$GITHUB_REF_NAME" = "v$package_version"

  build:
    needs: verify-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            system: x86_64-linux
            target: x86_64-unknown-linux-gnu
            release_os: linux
            release_arch: amd64
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
            target: aarch64-unknown-linux-gnu
            release_os: linux
            release_arch: arm64
          - runner: macos-15
            system: aarch64-darwin
            target: aarch64-apple-darwin
            release_os: darwin
            release_arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: cachix/install-nix-action@v31
      - name: Run required checks
        run: |
          nix develop --accept-flake-config --command cargo fmt --check
          nix develop --accept-flake-config --command cargo clippy --all-targets -- -D warnings
          nix develop --accept-flake-config --command ./hack/generate.sh --check
          nix flake check --accept-flake-config --print-build-logs
          nix flake check --accept-flake-config --print-build-logs ./extras
      - run: |
          cargo build --locked --release --target "${{ matrix.target }}"
          archive="orc_${GITHUB_REF_NAME#v}_${{ matrix.release_os }}_${{ matrix.release_arch }}"
          binary="target/${{ matrix.target }}/release/orc"
          mkdir -p dist
          mkdir -p \
            "$archive/bin" \
            "$archive/share/bash-completion/completions" \
            "$archive/share/fish/vendor_completions.d" \
            "$archive/share/nushell/vendor/autoload" \
            "$archive/share/orc" \
            "$archive/share/zsh/site-functions"
          install -m 0755 "$binary" "$archive/bin/orc"
          install -m 0644 LICENSE README.md "$archive/"
          "$binary" completion bash > "$archive/share/bash-completion/completions/orc"
          "$binary" completion fish > "$archive/share/fish/vendor_completions.d/orc.fish"
          "$binary" completion nu > "$archive/share/nushell/vendor/autoload/orc.nu"
          "$binary" completion zsh > "$archive/share/zsh/site-functions/_orc"
          "$binary" schema config > "$archive/share/orc/config.schema.json"
          "$binary" schema animation > "$archive/share/orc/terminal.animation.v1.schema.json"
          "$binary" schema provider > "$archive/share/orc/provider.schema.json"
          "$binary" schema resource > "$archive/share/orc/resource.schema.json"
          "$binary" schema state > "$archive/share/orc/state.schema.json"
          "$binary" schema workflow > "$archive/share/orc/workflow.schema.json"
          install -m 0644 assets/animations.yaml "$archive/share/orc/animations.yaml"
          tar -czf "dist/$archive.tar.gz" "$archive"
          (cd dist && shasum -a 256 "$archive.tar.gz" > "$archive.tar.gz.sha256")
      - uses: actions/upload-artifact@v7
        with:
          name: orc-${{ matrix.release_os }}-${{ matrix.release_arch }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create or update release
        run: |
          (cd dist && cat ./*.sha256 > checksums.txt)
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --repo "$GITHUB_REPOSITORY"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
