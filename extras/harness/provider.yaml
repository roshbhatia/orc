# yaml-language-server: $schema=https://raw.githubusercontent.com/roshbhatia/orc/main/schema/provider.schema.json
version: orc.provider/v1
name: harness
description: Resume sessions through the registered agent harness
kind: harness
command: orc-provider-harness
actions:
  provider.validate: Validate the configured agent registry and harness commands
  session.bind: Detect whether the harness session is active
  session.attach: Build the native harness resume command
  session.launch: Build the native harness launch command
requires:
  environment: [ORC_AGENT_REGISTRY]
priority: 100
