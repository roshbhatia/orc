# yaml-language-server: $schema=https://raw.githubusercontent.com/roshbhatia/orc/main/schema/provider.schema.json
version: orc.provider/v1
name: zmx
description: Keep harness processes available when displays close
kind: persistence
command: orc-provider-zmx
actions:
  provider.validate: Validate the Zmx adapter and command
  session.bind: Detect the current persistent process
  session.persist: Wrap a harness command in a persistent session
  session.stop: Stop a persistent agent process
requires:
  commands: [orc-provider-zmx-process-tree, zmx]
priority: 100
